<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Sommie Vendor Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo"><a href="index.html"><i class="fas fa-shopping-bag"></i><span>Sommie Vendor Shop</span></a></div>
            <div class="navbar-icons"><a href="cart.html" class="icon-btn active"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></a></div>
        </div>
    </nav>

    <div class="container cart-container">
        <h1 class="page-title">Shopping Cart</h1>
        <div id="emptyCartMessage" class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h2>Your cart is empty</h2>
            <a href="products.html" class="btn btn-primary">Continue Shopping</a>
        </div>
        <div id="cartContent" class="cart-content" style="display: none;">
            <table class="cart-table"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th><th>Action</th></tr></thead><tbody id="cartItemsBody"></tbody></table>
            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row"><span>Subtotal:</span><span id="subtotal">₦0</span></div>
                <div class="summary-row"><span>Tax:</span><span id="tax">₦0</span></div>
                <div class="summary-row total"><span>Total:</span><span id="total">₦0</span></div>
                <button class="btn btn-primary btn-block" onclick="proceedToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 Sommie Vendor Shop. Your Safety is Our Priority</p></div></div></footer>
    <div id="notificationContainer" class="notification-container"></div>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
