<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sommie Vendor Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-header"><i class="fas fa-crown"></i><h1>Admin Panel</h1><p>Sommie Vendor Shop Management</p></div>
            <form class="admin-form" id="adminLoginForm">
                <div class="form-group"><label>Username</label><div class="input-wrapper"><i class="fas fa-user-shield"></i><input type="text" placeholder="Admin username" required></div></div>
                <div class="form-group"><label>Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" placeholder="Admin password" required></div></div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <div class="security-notice"><i class="fas fa-shield-alt"></i><p>Secure Admin Area</p></div>
        </div>
    </div>
    <div id="notificationContainer" class="notification-container"></div>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
