<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sommie Vendor Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo"><a href="index.html"><i class="fas fa-shopping-bag"></i><span>Sommie Vendor Shop</span></a></div>
            <div class="navbar-icons"><button class="icon-btn dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon"></i></button></div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-user-lock"></i>
                <h1>Welcome Back</h1>
                <p>Sign in to your account</p>
            </div>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="text" id="email" placeholder="Enter email or username" required></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Enter password" required><button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')"><i class="fas fa-eye"></i></button></div>
                </div>
                <div class="auth-options"><label class="checkbox-label"><input type="checkbox"><span>Remember me</span></label><a href="#" class="forgot-link">Forgot Password?</a></div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="register.html" class="link-primary">Sign up here</a></p>
        </div>
    </div>

    <footer class="footer">
        <div class="container"><div class="footer-bottom"><p>&copy; 2026 Sommie Vendor Shop. Your Safety is Our Priority</p></div></div>
    </footer>
    <div id="notificationContainer" class="notification-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
