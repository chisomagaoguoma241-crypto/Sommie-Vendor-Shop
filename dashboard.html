<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sommie Vendor Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar"><div class="navbar-container"><div class="navbar-logo"><a href="index.html"><i class="fas fa-shopping-bag"></i><span>Sommie</span></a></div><button class="icon-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div></nav>

    <div class="container dashboard-container">
        <aside class="dashboard-sidebar">
            <div class="user-profile"><i class="fas fa-user-circle"></i><h3 id="userName">User</h3></div>
            <nav class="dashboard-menu">
                <a href="#profile" class="menu-item active" onclick="switchTab('profile')"><i class="fas fa-user"></i>Profile</a>
                <a href="#orders" class="menu-item" onclick="switchTab('orders')"><i class="fas fa-shopping-bag"></i>Orders</a>
                <a href="#wishlist" class="menu-item" onclick="switchTab('wishlist')"><i class="fas fa-heart"></i>Wishlist</a>
                <a href="#logout" class="menu-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</a>
            </nav>
        </aside>
        <main class="dashboard-content">
            <div id="profile" class="tab-content active"><h2>Profile</h2><form><input type="text" placeholder="Name" id="userName"><input type="email" placeholder="Email"><button type="submit" class="btn btn-primary">Save</button></form></div>
            <div id="orders" class="tab-content"><h2>Orders</h2><div id="ordersList"></div></div>
            <div id="wishlist" class="tab-content"><h2>Wishlist</h2><div id="wishlistGrid"></div></div>
        </main>
    </div>

    <footer class="footer"><div class="container"><p>&copy; 2026 Sommie Vendor Shop</p></div></footer>
    <script src="js/app.js"></script>
</body>
</html>
