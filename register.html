<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sommie Vendor Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo"><a href="index.html"><i class="fas fa-shopping-bag"></i><span>Sommie Vendor Shop</span></a></div>
            <div class="navbar-icons"><button class="icon-btn dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon"></i></button></div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card auth-card-lg">
            <div class="auth-header"><i class="fas fa-user-plus"></i><h1>Create Account</h1><p>Join Sommie Vendor Shop today</p></div>
            <form class="auth-form" id="registerForm">
                <div class="form-group"><label for="fullName">Full Name</label><div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="fullName" placeholder="Enter your full name" required></div></div>
                <div class="form-group"><label for="email">Email Address</label><div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Enter email" required></div></div>
                <div class="form-group"><label for="phone">Phone Number</label><div class="input-wrapper"><i class="fas fa-phone"></i><input type="tel" id="phone" placeholder="Enter phone" required></div></div>
                <div class="form-group"><label for="password">Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Create password" required></div></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="confirmPassword" placeholder="Confirm password" required></div></div>
                <label class="checkbox-label"><input type="checkbox" required><span>I agree to Terms & Conditions</span></label>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html" class="link-primary">Sign in</a></p>
        </div>
    </div>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 Sommie Vendor Shop. Your Safety is Our Priority</p></div></div></footer>
    <div id="notificationContainer" class="notification-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
