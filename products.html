<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Sommie Vendor Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo"><a href="index.html"><i class="fas fa-shopping-bag"></i><span>Sommie Vendor Shop</span></a></div>
            <div class="search-bar"><input type="text" placeholder="Search products..." id="searchInput"><button type="submit" class="search-btn"><i class="fas fa-search"></i></button></div>
            <ul class="navbar-menu"><li><a href="index.html">Home</a></li><li><a href="products.html" class="active">Products</a></li><li><a href="index.html#categories">Categories</a></li></ul>
            <div class="navbar-icons">
                <button class="icon-btn dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon"></i></button>
                <a href="login.html" class="icon-btn"><i class="fas fa-user"></i></a>
                <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></a>
            </div>
        </div>
    </nav>

    <div class="container products-container">
        <aside class="sidebar">
            <h3>Filters</h3>
            <div class="filter-group"><h4>Category</h4>
                <label class="filter-checkbox"><input type="checkbox" value="gadgets" onchange="applyFilters()"><span>Phone Gadgets</span></label>
                <label class="filter-checkbox"><input type="checkbox" value="clothes" onchange="applyFilters()"><span>Clothes</span></label>
                <label class="filter-checkbox"><input type="checkbox" value="footwear" onchange="applyFilters()"><span>Footwear</span></label>
                <label class="filter-checkbox"><input type="checkbox" value="gaming" onchange="applyFilters()"><span>Gaming</span></label>
            </div>
            <button class="btn btn-secondary btn-block" onclick="resetFilters()">Reset Filters</button>
        </aside>

        <main class="products-main">
            <div class="products-header">
                <p id="resultsCount">Showing all products</p>
                <div class="sort-dropdown"><label for="sortSelect">Sort:</label><select id="sortSelect" onchange="sortProducts()"><option value="newest">Newest</option><option value="price">Price</option></select></div>
            </div>
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-column"><h4>About</h4><ul><li><a href="about.html">About Us</a></li></ul></div>
                <div class="footer-column"><h4>Links</h4><ul><li><a href="products.html">Shop</a></li></ul></div>
            </div>
            <div class="footer-bottom"><p>&copy; 2026 Sommie Vendor Shop. Your Safety is Our Priority</p></div>
        </div>
    </footer>
    <div id="notificationContainer" class="notification-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
